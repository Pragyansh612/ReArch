[project]
name = "rearch"
version = "0.1.0"
description = "AI-assisted legacy modernization advisor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6", "types-PyYAML"]

[tool.setuptools]
packages = ["analyzer", "api", "llm"]

[tool.pytest.ini_options]
testpaths = ["analyzer/tests", "api/tests", "llm/tests"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["targets/", "web/", "\\.venv/"]

[tool.ruff]
line-length = 100
extend-exclude = ["targets", "web", ".venv"]
