# =====================================================================================================
# ILLUSTRATIVE ASSUMPTIONS -- NOT MARKET DATA.
# Every rate, multiplier, weight and base value in the Phase 3 engine below was chosen to make the model
# behave sensibly and be explainable. None of it comes from benchmarks or from any client.
# A real engagement would calibrate against: the firm's rate card (daily rates), delivery data from comparable
# migrations (days per KLOC by strategy), the client's actual team capacity (team size), a defect/incident history
# or a risk workshop (risk factors), and the client's own maintenance cost records (value). Until then every yen
# figure in the product is shown with these assumptions next to it.
# =====================================================================================================
currency: JPY
daily_rate_jpy: 80000        # ILLUSTRATIVE: blended consulting day rate. Calibrate: firm rate card x team mix.
base_days_per_kloc:          # ILLUSTRATIVE: effort per 1,000 code lines before multipliers.
  rehost: 2                  #   Calibrate: velocity from similar completed migrations, estimation workshop.
  replatform: 8
  refactor: 20
  rearchitect: 45
  retire: 1

# ---------------------------------------------------------------------------
# Phase 2: analyzer rules. The analyzer reads everything below; nothing is hard-coded.
# fixtures/expected.json only holds expected OUTPUTS. Definitions live in docs/methodology.md.
# ---------------------------------------------------------------------------
analysis:
  # A module is the first package segment after one of these roots
  # (com.example.legacy.order.Foo -> "order"). Longest matching root wins.
  module_roots:
    - com.example.legacy
    - org.apache.ofbiz
    - org.mybatis.jpetstore

  # Source layout, relative to each analysed directory.
  main_java_dir: src/main/java
  test_java_dir: src/test/java
  test_groovy_dir: src/test/groovy   # Groovy tests are counted as test evidence, never parsed
  services_dir_name: servicedef        # directories holding OFBiz service definitions
  testdef_dir_name: testdef            # OFBiz test suites: <test-suite><test-case>...
  testdef_data_load_elements: [entity-xml]   # a test-case holding only these loads data; it is not a test
  skip_dirs: [.git, node_modules, build, target, .gradle, out]
  date_based_version_min: 1900   # a leading number >= this is treated as a calendar version, not a major

  # Analysis coverage: how much of a component's logic is Java (analysed) versus Groovy / XML / generated
  # (not analysed). Share = Java service definitions / implemented service definitions
  # (engines `interface`, `group` and `entity-auto` implement no custom logic and are excluded from the denominator).
  # A module belongs to the component directory that holds most of its classes.
  coverage:
    high_min_java_share: 0.60     # >= 0.60 -> confidence "high"
    medium_min_java_share: 0.30   # >= 0.30 -> "medium", otherwise "low"
    # a file's component is the path before the first of these directories (service defs, controllers, Groovy...)
    component_dir_markers: [src, servicedef, webapp, testdef, config, widget, entitydef, groovyScripts, script]
    # `entity-auto` is generated CRUD (declarative, no hidden custom logic), so it is excluded from the denominator too;
    # its count is still reported (`entity_auto_defs`).
    non_implementing_engines: [interface, group, entity-auto]

  # Approximate cyclomatic complexity of a class: bodies + decision points.
  complexity_bands:
    low_max: 15        # <= 15 is low
    medium_max: 50     # 16..50 is medium, > 50 is high

  god_class:           # "large" tier: BOTH must hold
    min_loc: 400               # loc >= 400
    min_complexity_above: 50   # complexity > 50
    extreme:                   # "extreme" tier (also large): BOTH must hold
      min_loc: 1500
      min_complexity_above: 200

  highly_coupled:      # BOTH must hold (Java fan-in/out, not service fan-in)
    min_fan_in: 5
    min_fan_out: 8

  # Database coupling: one instance per matching method call in code
  # (tree-sitter method_invocation; comments and string literals never match).
  # `receiver` is the simple name of the object the method is called on; omit to match any receiver.
  db_coupling:
    ignore_classes: [EntityQuery, Delegator]   # the entity-engine API itself, not business logic
    jdbc:
      - {receiver: DriverManager, method: getConnection}
      - {method: prepareStatement}
      - {method: createStatement}
    entity_engine:
      - {receiver: EntityQuery, method: use}
      - {receiver: delegator, method: makeValue}
      - {receiver: delegator, method: create}
      - {receiver: delegator, method: store}
      - {receiver: delegator, method: findOne}
      - {receiver: delegator, method: findList}
      - {receiver: delegator, method: findByAnd}
      - {receiver: delegator, method: findAll}
      - {receiver: delegator, method: removeValue}
      - {receiver: delegator, method: removeByAnd}
      - {receiver: delegator, method: getNextSeqId}

  # Legacy markers are import statements.
  legacy_markers:
    # javax.* packages that moved to jakarta.* (JDK packages such as javax.sql / javax.crypto are NOT listed).
    javax_migrating: [servlet, mail, ejb, persistence, jms, transaction, activation, ws, annotation,
                      inject, validation, faces, el, json, jws, resource, enterprise, batch,
                      xml.bind, xml.ws, xml.soap]
    legacy_frameworks:
      struts: [org.apache.struts, org.apache.struts2, com.opensymphony.xwork2]

# Versions whose leading number is a year/date (e.g. 20240325.1) are not semantic majors: they are reported as
# unchecked rather than compared. Threshold is `analysis.date_based_version_min`.
# Dependency age comes from a dated snapshot of the latest stable versions on Maven Central, produced once by
# `python scripts/snapshot_deps.py` and committed (config/dependency_snapshot.yaml). The analyzer never touches the
# network. A dependency is outdated when its declared major < the snapshot's latest major, or the coordinate has been
# superseded under a new name (javax.* -> jakarta.*, listed in config/dependency_renames.yaml). Coordinates missing
# from the snapshot are reported as unchecked.
dependency_snapshot_file: dependency_snapshot.yaml   # relative to this file

# ---------------------------------------------------------------------------
# Phase 3 / 3.5: scoring and strategies (ALL ILLUSTRATIVE, see the banner at the top of this file).
# The client's constraints, objectives and criticality overrides live in config/client_scenario.yaml.
# ---------------------------------------------------------------------------
engine:
  # `retain` (do nothing) is always an option and the baseline for TCO, payback and NPV. Order = tie-break order.
  strategies: [retain, rehost, replatform, refactor, rearchitect, retire]

  # --- effort -> cost -> duration (migration) ---------------------------------------------------------
  # effort_days = KLOC x base_days_per_kloc[strategy] x complexity_multiplier x (1 + test_overhead)
  #               x coverage_uncertainty_buffer   (+ a safety-net-tests line for rearchitect without tests)
  working_days_per_month: 20
  team_size:                   # ILLUSTRATIVE. duration_months = effort_days / (team_size x working_days_per_month)
    rehost: 2                  #   Calibrate: client capacity and the strategy's real parallelism.
    replatform: 4
    refactor: 6
    rearchitect: 8
    retire: 2
  complexity_multiplier:       # multiplier = 1 + (max - 1) x unit complexity percentile (0..1) x sensitivity
    max: 1.6
    sensitivity: {rehost: 0.1, replatform: 0.5, refactor: 1.0, rearchitect: 1.0, retire: 0.1}
  test_overhead:               # extra share of effort spent on testing; grows when there is little test evidence
    base: {rehost: 0.10, replatform: 0.20, refactor: 0.35, rearchitect: 0.40, retire: 0.05}
    untested_extra: 1.0        # test_overhead = base x (1 + untested_extra x test_gap)   (test_gap 0..1)
  coverage_uncertainty_buffer: # multiplies effort when the analyzer can see little of the logic
    high: 1.00
    medium: 1.15
    low: 1.35
  safety_net_days_per_kloc: 4.0   # rearchitect without test evidence: tests written first (own effort line)

  # --- total cost of ownership over the client's planning horizon (horizon is in the scenario file) -------
  # tco = migration_cost + sum over years (run_cost + maintenance_cost)
  # baseline maintenance (per year) = KLOC x days x (1 + penalty x (1 - health/100)) x daily_rate: worse health costs more
  # after migration, maintenance = baseline x (1 - long_term_value.debt_reduction[strategy])   (residual debt stays)
  # after migration, run cost = baseline run x residual_run_cost[strategy]   (hosting differs by strategy)
  # migration spend is spread evenly over the migration duration; savings start when the migration ends.
  tco:
    discount_rate: 0.04                      # ILLUSTRATIVE. Calibrate: client's cost of capital.
    maintenance_days_per_kloc_year: 6.0      # ILLUSTRATIVE. Calibrate: client's own maintenance time records.
    debt_maintenance_penalty: 1.5
    run_cost_jpy_per_kloc_year: 150000       # ILLUSTRATIVE. Calibrate: client's hosting invoices.
    residual_run_cost: {retain: 1.0, rehost: 0.85, replatform: 0.70, refactor: 0.95, rearchitect: 0.60, retire: 0.0}

  # --- delivery risk (0-100, higher = riskier) ----------------------------------------------------------------
  # exposure = sum(weight x 0..1 measure) over the factors below (weights sum to 1), so exposure is 0..1
  # risk = min(100, base_risk[strategy] x (1 + exposure_gain x exposure))
  # retain has no change risk, but leaving a fragile, critical, untested unit alone is risky:
  #   retain risk = min(100, retain.risk_scale x 100 x exposure)
  risk:
    base: {rehost: 8, replatform: 18, refactor: 30, rearchitect: 48, retire: 12}   # ILLUSTRATIVE
    exposure_gain: 1.0
    factor_weights: {health: 0.30, criticality: 0.25, tests: 0.20, cycles: 0.10, confidence: 0.15}
    confidence_gap: {high: 0.0, medium: 0.5, low: 1.0}
  retain:
    risk_scale: 0.5

  # --- cutover approach: how a strategy goes live, and the downtime of each cutover EVENT ------------------------
  # big_bang: the whole package moves in one window (freeze, data sync, switch); hours = base[strategy] + hours_per_kloc x KLOC,
  #           so a bigger package needs a longer window. One event.
  # incremental (strangler): the package is cut over in slices, each small and short; slices = ceil(KLOC / slice_kloc);
  #           every slice is one event of hours_per_slice. Old and new run in parallel while slices move, which costs
  #           parallel_run_effort_share x the core work as an extra effort line.
  # The client's downtime limit applies PER EVENT. ILLUSTRATIVE: calibrate from comparable cutovers.
  cutover:
    approach: {retain: none, rehost: big_bang, replatform: big_bang, refactor: incremental, rearchitect: incremental, retire: big_bang}
    big_bang:
      base_hours: {rehost: 2.0, replatform: 4.0, retire: 1.0}
      hours_per_kloc: 0.25
    incremental:
      slice_kloc: 3.0
      hours_per_slice: 0.5
      parallel_run_effort_share: 0.15

  # --- change cost: what each change request costs, which depends on how healthy the code is -------------------
  # cost per change = base_days_per_change x (1 + health_penalty x (1 - health/100)) x daily_rate
  # after migration the multiplier uses the RESIDUAL debt: 1 + health_penalty x (1 - debt_reduction[strategy]) x (1 - health/100)
  # change requests per year per module come from the client scenario; a package gets its module's share by LOC.
  # The yearly saving is a separate benefit line in TCO. The objective named below is monetised there, so the value score
  # leaves it out (and renormalises the remaining objective weights) instead of counting the same saving twice.
  change_cost:
    base_days_per_change: 1.0      # ILLUSTRATIVE: one engineer-day for a change in perfectly healthy code
    health_penalty: 2.0            # ILLUSTRATIVE: the worst code makes a change up to 3x as expensive
    monetised_objective: change_lead_time

  # --- calibration to the client's own maintenance figure (scenario `client_reported_maintenance_jpy`) ----------------
  calibration:
    gap_flag_pct: 25               # flag a module when the model estimate and the client figure differ by more than this

  # --- breakeven: the yearly maintenance spend at which the recommendation would change ----------------------------
  breakeven:
    range_factor: 100              # searched between baseline / 100 and baseline x 100
    steps: 120

  # --- long-term value (0-100, higher = better) -----------------------------------------------------------------
  # value = min(100, debt_reduction[strategy] x burden x criticality_weight[criticality] x objective_fit[strategy])
  #   burden = debt_weight x (100 - health) + (1 - debt_weight) x maintenance_points
  #   objective_fit[strategy] = sum over the client's NON-monetised objectives of (objective weight x objective_effect),
  #                             divided by the sum of those weights (the monetised objective is in TCO instead)
  long_term_value:
    debt_reduction: {rehost: 0.05, replatform: 0.25, refactor: 0.55, rearchitect: 0.85, retire: 1.0}
    debt_weight: 0.6
    maintenance_kloc_cap: 30   # maintenance_points = min(100, 100 x KLOC / cap): bigger units cost more to keep
    criticality_weight: {1: 0.6, 2: 1.0, 3: 1.4}   # ILLUSTRATIVE: improving a critical unit is worth more
    # Which of the client's objectives a strategy can move, as the share of the gap it can close in principle (0..1).
    # E.g. rehost changes where the system runs (infra cost) but not how fast the code can be changed.
    objective_effect:
      retain:      {maintenance_cost: 0.0, change_lead_time: 0.0, expert_dependency: 0.0, run_cost: 0.0}
      rehost:      {maintenance_cost: 0.05, change_lead_time: 0.0, expert_dependency: 0.0, run_cost: 0.6}
      replatform:  {maintenance_cost: 0.20, change_lead_time: 0.1, expert_dependency: 0.1, run_cost: 0.8}
      refactor:    {maintenance_cost: 0.60, change_lead_time: 0.6, expert_dependency: 0.5, run_cost: 0.1}
      rearchitect: {maintenance_cost: 0.80, change_lead_time: 0.9, expert_dependency: 0.8, run_cost: 0.5}
      retire:      {maintenance_cost: 1.0, change_lead_time: 1.0, expert_dependency: 1.0, run_cost: 1.0}

  # --- priorities: weights over the four criteria, each preset sums to 1 ---------------------------------------
  priorities:
    default: balanced          # the scenario's own priorities (client_scenario) are added as a further profile
    presets:
      minimize_cost:    {cost: 0.60, risk: 0.15, speed: 0.15, long_term_value: 0.10}
      minimize_risk:    {cost: 0.10, risk: 0.60, speed: 0.10, long_term_value: 0.20}
      speed_to_market:  {cost: 0.20, risk: 0.10, speed: 0.60, long_term_value: 0.10}
      long_term_value:  {cost: 0.10, risk: 0.15, speed: 0.05, long_term_value: 0.70}
      balanced:         {cost: 0.25, risk: 0.25, speed: 0.25, long_term_value: 0.25}

  # --- scoring scales: how raw numbers become 0..1 "goodness" (absolute, NOT relative to the other options) -----
  # cost goodness  = max(0, 1 - tco / (cost_ratio_ceiling x retain_tco))   [cost = 5-year TCO, scored against doing nothing]
  # speed goodness = max(0, 1 - duration_months / duration_ceiling_months)
  # risk goodness  = 1 - risk / 100          value goodness = value / 100
  scoring:
    cost_ratio_ceiling: 3.0        # an option whose TCO is 3x the do-nothing TCO scores 0 on cost
    duration_ceiling_months: 24
  close_call_margin: 5.0           # score points (0-100) between best and runner-up below which we flag a close call

  # --- work packages: the units that get a strategy (a module can mix strategies) ----------------------------
  # (a) each class cycle (strongly connected component) is one package per module it touches
  # (b) each extreme god class not in a cycle, grown with its satellites: an unassigned class in the same module joins
  #     when at least `satellite_min_share` of its in-module neighbours are already in the package
  # (c) the remainder of each module
  work_packages:
    satellite_min_share: 0.5

  # --- technical health (0-100, higher = healthier) ------------------------------------------------------------
  # health = 100 - sum of (100 x weight x normalized), each normalized 0 (good) .. 1 (bad)
  # Outdated dependencies are NOT a component: they are estate-wide and cannot tell units apart, so they are an
  # estate-level finding. Exception: a module with its OWN build file gets the component with `own_build_file_weight`
  # and the other weights are scaled by (1 - that weight).
  health:
    weights:                       # must sum to 1 (the former weights divided by 0.9, rounded)
      size: 0.11
      complexity: 0.22
      coupling: 0.17
      cycles: 0.11
      test_evidence: 0.22
      db_coupling: 0.11
      legacy_markers: 0.06
    own_build_file_weight: 0.10
    test_target_per_kloc: 5.0      # ILLUSTRATIVE: tests (Java @Test + max(Groovy test files, testdef cases)) per KLOC for full credit
    # db_coupling = min(1, ln(1 + calls per KLOC) / ln(1 + reference)). Call counts are heavy-tailed, so a log scale
    # keeps differences visible; the reference (calls/KLOC at which the component maxes out) is deliberately high:
    # one database call every ten code lines.
    db_calls_per_kloc_reference: 100.0
  hotspots:
    top_n: 15
    weights:                       # class-level score = sum(weight x 0..100 value); sums to 1
      complexity_percentile: 0.30
      loc_percentile: 0.25
      fan_out_percentile: 0.15
      fan_in_percentile: 0.10
      db_density: 0.10
      in_cycle: 0.10

  # --- business criticality (1-3): a proposal; the client scenario's overrides win ------------------------------
  # score = w_in x (module share of estate inbound references) + w_write x (module share of estate data writes)
  criticality:
    inbound_weight: 0.6
    write_weight: 0.4
    high_min_score: 0.30       # score >= 0.30 -> 3 ; >= 0.12 -> 2 ; else 1  (ILLUSTRATIVE: relative to the estate)
    medium_min_score: 0.12
    write_matches:             # entity-engine calls that change data (matched against DbInstance.match)
      - delegator.makeValue(
      - delegator.create(
      - delegator.store(
      - delegator.removeValue(
      - delegator.removeByAnd(
      - delegator.getNextSeqId(
    jdbc_counts_as_write: true   # SQL strings are not parsed, so JDBC calls are conservatively treated as writes

  # --- sensitivity search ----------------------------------------------------------------------------------
  sensitivity:
    range_factor: 10.0         # multiplicative parameters are tried between value/10 and value x 10
    steps: 200

# ---------------------------------------------------------------------------
# Phase 4: portfolio and roadmap (ILLUSTRATIVE, see the banner at the top of this file).
# ---------------------------------------------------------------------------
roadmap:
  # Capacity: people working at once = teams x team_size_people. A package occupies the people its strategy needs
  # (engine.team_size[strategy], capped at the capacity) for its whole duration.
  teams: 2
  team_size_people: 6
  yearly_budget_cap_jpy: null      # optional cap on programme spend per programme year (months 1-12, 13-24, ...); null = none
  search_horizon_months: 240       # how far the scheduler looks for a slot before declaring a job unscheduled
  wave_name_template: "Wave {n}"

  # Quick wins are scheduled first (they build the client's confidence): low risk AND short.
  quick_win: {max_risk: 20.0, max_months: 3.0}

  # Wave 0 foundations: estimated from transparent formulas, effort in days x the daily rate; duration = days / (people x 20).
  foundations:
    team_people: 4
    cicd: {base_days: 40, days_per_package: 5}              # base + days_per_package x packages that change code
    observability: {base_days: 30, days_per_kloc: 0.5}      # base + days_per_kloc x KLOC of the packages that need it
    facade: {base_days: 30, days_per_package: 10}           # API facade that strangler (incremental) packages cut over behind
    weak_test_gap: 0.8               # a refactored/rearchitected package with test gap >= this gets a safety-net suite first
    required_by:                     # which strategies need which foundation before they start
      cicd: [replatform, refactor, rearchitect]
      observability: [replatform, rearchitect]
      facade: [refactor, rearchitect]
    strategy_rank: {retain: 0, rehost: 1, replatform: 2, refactor: 3, rearchitect: 4, retire: 5}

  # Final wave, "What modernization unlocks": a deterministic mapping from modernized packages to data/AI opportunities.
  # An opportunity is unlocked when, for every requirement, the packages of that module whose chosen strategy ranks at least
  # `min_strategy` hold at least `min_loc_share` of the module's code. Its prerequisites are those packages.
  unlocks:
    - id: demand_forecasting
      name: Demand forecasting
      kind: ai
      description: Order and catalogue APIs make order history and product data available to a forecasting model.
      requires: [{module: order, min_strategy: refactor, min_loc_share: 0.6}, {module: product, min_strategy: replatform, min_loc_share: 0.5}]
    - id: automated_reconciliation
      name: Automated invoice and payment reconciliation
      kind: ai
      description: Invoice and payment data becomes accessible through APIs, so matching can be automated.
      requires: [{module: accounting, min_strategy: refactor, min_loc_share: 0.6}]
    - id: customer_360
      name: Single customer view
      kind: data
      description: Party and order APIs let customer, contact and order history be joined in one place.
      requires: [{module: party, min_strategy: replatform, min_loc_share: 0.6}, {module: order, min_strategy: refactor, min_loc_share: 0.6}]
    - id: delivery_eta_prediction
      name: Delivery time prediction
      kind: ai
      description: Shipment and order events exposed as APIs feed a delivery-time model for customer commitments.
      requires: [{module: shipment, min_strategy: refactor, min_loc_share: 0.6}, {module: order, min_strategy: refactor, min_loc_share: 0.6}]
